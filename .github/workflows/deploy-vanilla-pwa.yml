name: Publish demo and presentation

on:
  push:
    branches: [main]
    paths:
      - vanilla-pwa/**
      - docs/Same_App_Different_Stack.html
      - docs/qr/**
      - .github/workflows/deploy-vanilla-pwa.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node for verification only
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original participants and check-in logic
        run: node --test vanilla-pwa/tests/*.test.mjs
      - name: Prepare static files without a build
        run: |
          mkdir -p _site/vendor _site/talk _site/qr
          cp vanilla-pwa/index.html vanilla-pwa/styles.css vanilla-pwa/manifest.webmanifest vanilla-pwa/sw.js _site/
          cp -R vanilla-pwa/src vanilla-pwa/icons _site/
          cp vanilla-pwa/vendor/jsQR.js vanilla-pwa/vendor/jsQR.LICENSE _site/vendor/
          cp docs/Same_App_Different_Stack.html _site/talk/index.html
          cp docs/qr/*.png _site/qr/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
