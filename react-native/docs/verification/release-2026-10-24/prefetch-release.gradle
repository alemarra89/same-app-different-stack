import org.gradle.api.artifacts.component.ModuleComponentIdentifier

// Resolve external Release artifacts without compiling application/library sources.
gradle.projectsEvaluated {
    rootProject.allprojects.each { p ->
        p.tasks.register('prefetchReleaseDependencies') {
            doLast {
                p.configurations.findAll { configuration ->
                    def name = configuration.name.toLowerCase()
                    configuration.canBeResolved && !name.contains('test') &&
                        (name.contains('release') || (name.contains('lint') && !name.contains('debug')))
                }.each { configuration ->
                        def files = configuration.incoming.artifactView {
                            componentFilter { id -> id instanceof ModuleComponentIdentifier }
                        }.files.files
                        println("PREFETCH ${p.path}:${configuration.name}: ${files.size()} external artifacts")
                }
            }
        }
    }
}
